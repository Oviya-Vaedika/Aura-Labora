<script type="module">
const $=(s,root=document)=>root.querySelector(s),$$=(s,root=document)=>[...root.querySelectorAll(s)];
const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};

let profile=read('aura-simple-profile',null),history=read('aura-simple-history',[]),reports=read('aura-simple-reports',[]),page='Overview',subject='All',search='',scope='All additional',active=null,params={},readings=[],chat=[],tab='Procedure',conclusion='',config={},supabase=null,session=null;

const E=[
{id:'ohm',subject:'Physics',title:'Investigate Ohm’s law',chapter:'Electricity',classes:[10,12],aim:'Investigate voltage and current across an ideal resistor.',principle:'At constant temperature, V = IR and P = VI. This ideal resistor does not heat up or change resistance.',materials:['DC supply','Resistor','Ammeter','Voltmeter','Wires'],steps:['Select resistance.','Close the switch and set a voltage.','Record calculated current.','Repeat at several voltages.','Compare V/I at fixed resistance.'],viva:['How is an ammeter connected?','Why is constant temperature important?','What does V/I represent?'],controls:[['V','Voltage','V',0,12,.1,6],['R','Resistance','Ω',10,1000,10,100]]},
{id:'pendulum',subject:'Physics',title:'Explore a simple pendulum',chapter:'Oscillations',classes:[11],aim:'Explore how length and local gravity affect the period.',principle:'T = 2π√(L/g), valid for small-amplitude oscillations. Neglect drag, friction and string mass.',materials:['Ideal string','Bob','Support','Virtual timer'],steps:['Choose length and gravity.','Inspect the small-angle model.','Record the calculated period.','Change length at fixed gravity.','Compare T² with length.'],viva:['Does bob mass affect this ideal period?','Why use a small angle?','What happens when length is quadrupled?'],controls:[['L','Length','m',.2,2,.05,1],['g','Gravity','m/s²',1.6,20,.1,9.8]]},
{id:'lens',subject:'Physics',title:'Explore a convex lens',chapter:'Light and optics',classes:[10,12],aim:'Explore image position and magnification using a thin lens.',principle:'1/f = 1/dₒ + 1/dᵢ; m = −dᵢ/dₒ. Object distance is a positive magnitude; image distance is signed. The paraxial model gives an image at infinity at the focal point.',materials:['Thin convex lens','Object','Optical bench'],steps:['Choose focal length.','Place the object outside the focus.','Record image distance and magnification.','Move the object inside the focus.','Compare real/inverted and virtual/upright images.'],viva:['When is the image virtual?','What happens at the focus?','What does negative magnification mean?'],controls:[['f','Focal length','cm',5,30,1,15],['d','Object distance','cm',5,100,1,40]]},
{id:'ph',subject:'Chemistry',title:'Investigate acids and bases',chapter:'Acids, bases and salts',classes:[7,10,11],aim:'Calculate pH of an ideal strong monoprotic acid or base at 25 °C.',principle:'For analytical concentration C, major ion concentration = (C + √(C² + 4Kw))/2, with Kw = 10⁻¹⁴. pH = −log₁₀[H⁺]. Strong fully dissociated acid/base only; no activity corrections. Colours are illustrative.',materials:['Virtual beaker','Strong monoprotic acid/base','Illustrative universal indicator'],steps:['Select acid or base.','Set the concentration exponent.','Record calculated pH.','Lower concentration to model dilution.','Explain why pH moves toward 7.'],viva:['What does pH measure?','Why does dilution move pH toward 7?','Why is this not a weak-acid model?'],controls:[['exp','Concentration exponent (10ˣ)','mol/L',-7,-1,.1,-3]]},
{id:'cells',subject:'Biology',title:'Explore an onion epidermal cell',chapter:'Cell structure',classes:[9,11],aim:'Identify schematic onion epidermal cells and explore microscope magnification.',principle:'Total magnification = eyepiece × objective. Here the eyepiece is 10×. The view is a schematic, not a real micrograph; blur is only a focus illustration.',materials:['Virtual microscope','Schematic onion-cell slide','10× eyepiece'],steps:['Choose an objective.','Adjust focus toward zero.','Toggle labels.','Record total magnification.','Explain the limits of a schematic model.'],viva:['What is the function of the cell wall?','How is total magnification calculated?','How does this diagram differ from a micrograph?'],controls:[['focus','Focus offset','',-5,5,.1,0]]},
{id:'genetics',subject:'Biology',title:'Predict a monohybrid cross',chapter:'Inheritance',classes:[10,12],aim:'Predict theoretical genotype and phenotype probabilities.',principle:'Each parent contributes one allele. Assume equal segregation and complete dominance. The four Punnett-square combinations are equally probable, not observed offspring counts.',materials:['Parental genotype selectors','Punnett square'],steps:['Choose each parent genotype.','Inspect all four allele combinations.','Record theoretical probabilities.','Compare Aa × Aa with Aa × aa.','Explain why actual counts can differ.'],viva:['How do genotype and phenotype differ?','What assumptions give a 3:1 phenotype ratio?','Why are predicted ratios not guaranteed counts?'],controls:[]}
];
function calc(id,p){if(id==='ohm')return [['Current',p.closed?p.V/p.R:0,'A'],['Power',p.closed?p.V*p.V/p.R:0,'W']];if(id==='pendulum'){let t=2*Math.PI*Math.sqrt(p.L/p.g);return [['Period',t,'s'],['Frequency',1/t,'Hz']]}if(id==='lens'){let den=1/p.f-1/p.d,v=Math.abs(den)<1e-10?null:1/den;return [['Image distance',v,'cm'],['Magnification',v===null?null:-v/p.d,'×']]}if(id==='ph'){let C=10**p.exp,m=(C+Math.sqrt(C*C+4e-14))/2;return [['Calculated pH',p.base?14+Math.log10(m):-Math.log10(m),''],['Concentration',C,'mol/L']]}if(id==='cells')return [['Total magnification',10*p.objective,'×'],['Focus offset',p.focus,'']];let combos=[...p.a].flatMap(a=>[...p.b].map(b=>[a,b].sort().join(''))),n=g=>combos.filter(x=>x===g).length/4;return [['AA / Aa / aa',`${n('AA')*100} / ${n('Aa')*100} / ${n('aa')*100}`,'%'],['Dominant phenotype',(1-n('aa'))*100,'%']]}
const fmt=v=>v===null?'∞ / undefined':typeof v==='number'?(Math.abs(v)>0&&Math.abs(v)<.001?v.toExponential(3):Number(v.toFixed(4))):v;
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,4500)}
function nav(to,s='All'){page=to;subject=s;search='';scope='All additional';render()}
function render(){
 const name=escapeHTML(profile?.name||'Explorer'),grade=profile?.grade||10;
 $('#app').innerHTML=`<div class="layout"><aside class="sidebar"><div class="brand"><img src="/aura-logo.jpg" alt="AURA LABORA logo"><span>AURA LABORA<small>THE DISCOVERY PLATFORM</small></span></div><div class="nav-label">WORKSPACE</div><nav class="nav">${['Overview','Experiment library','My discoveries'].map(x=>`<button data-page="${x}" class="${page===x?'active':''}">${x}</button>`).join('')}<button data-action="studio">DUBIS experiment studio</button><button data-action="settings">Class & settings</button></nav><div class="nav-label">LABORATORIES</div><nav class="nav">${Object.keys(symbols).map(s=>`<button data-subject="${s}">${symbols[s]} ${s} lab</button>`).join('')}</nav><div class="sidebar-note"><span class="star">✧</span><h3>Your curiosity.<br>New possibilities.</h3><p>Explore science with DUBIS, your personal laboratory companion.</p><button data-action="studio" class="full">Meet DUBIS →</button></div></aside><div class="shell"><header class="topbar"><span>Workspace / ${page}</span><div><span class="dot">● Virtual workspace</span><button data-action="settings">Class ${grade} ▾</button></div></header><main><section class="heading"><div><span class="eyebrow">YOUR NEXT DISCOVERY STARTS HERE</span><h1>${page==='Overview'?`Welcome back, ${name}.`:page==='My discoveries'?'Your discoveries.':'Follow your curiosity.'}</h1><p>A universe of scientific discovery. One experiment at a time.</p></div><button class="primary" data-action="studio">＋ Create an experiment</button></section>${page==='Overview'?`<section class="hero"><div class="hero-copy"><span class="eyebrow">WELCOME TO AURA LABORA</span><h2>A universe of<br>scientific <span>discovery.</span></h2><p>Step inside your virtual laboratory. Explore ideas, change variables and discover the science behind the world.</p><div class="hero-actions"><button class="primary" data-page="Experiment library">Enter the laboratories →</button><button data-action="studio">✧ Meet DUBIS AI</button></div></div><div class="hero-art"><img src="/aura-logo.jpg" alt="AURA LABORA science emblem"></div></section><div class="section-head"><h2>Your laboratories</h2><span class="muted">Three worlds. New possibilities.</span></div><section class="lab-cards">${Object.keys(symbols).map(s=>`<button class="lab-card ${s.toLowerCase()}" data-subject="${s}"><span class="symbol">${symbols[s]}</span><h3>${s} ↗</h3><p>${s==='Physics'?'Matter. Motion. Possibility.':s==='Chemistry'?'Elements of discovery.':'Life, under a new lens.'}</p><small>${E.filter(e=>e.subject===s).length} interactive templates</small></button>`).join('')}</section>`:''}<div id="content"></div><footer><span>AURA LABORA — A universe of scientific discovery.</span><span>Calculated simulations · Not physical measurements</span></footer></main></div></div>`;
 $$('[data-page]').forEach(b=>b.onclick=()=>nav(b.dataset.page));$$('[data-subject]').forEach(b=>b.onclick=()=>nav('Experiment library',b.dataset.subject));$$('[data-action="studio"]').forEach(b=>b.onclick=studio);$$('[data-action="settings"]').forEach(b=>b.onclick=()=>settings(false));renderContent();
